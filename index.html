<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <!-- ≤160 chars — Google truncates around 155–160. -->
    <meta
      name="description"
      content="Play Elyxion free in your browser — a Quake-style instagib FPS. One railgun, one shot, one kill. No download. FFA, TDM, and ranked 1v1 duels."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- CrazyGames QA metadata. This is a PEGI 12 title (stylised sci-fi
         violence — no blood, no gore, no realistic harm to humans) and it
         in-app-purchases credits for cosmetics, which are cosmetic-only. -->
    <meta name="crazygames" content="pegi-12;in-app-purchases" />

    <!-- CrazyGames SDK v3 (https://docs.crazygames.com/sdk/intro/). Per the
         docs the <script> tag must be present in the head of index.html —
         QA and platform detection look for it literally, so it is ALWAYS
         included. The SDK itself is domain-aware: on CrazyGames and localhost
         it runs fully, on any other host (our own site, itch, embeds) init()
         resolves to the "disabled" environment and src/crazygames/index.ts
         treats every call as a safe no-op — the game stays fully playable
         outside CrazyGames. On localhost the SDK shows demo ads / a fake user
         ONLY with the ?cgdev=1 flag (simulated "local" environment for
         testing the integration); without it init() resolves as disabled and
         local dev stays clean. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <title>Elyxion — Free Browser FPS, One Shot One Kill</title>
    <link rel="canonical" href="https://instagib.win/" />

    <!-- Social link previews: a pasted invite / share link renders as a game,
         not a naked URL. og-image.png lives in /public (1200x630).
         OG image MUST be an absolute URL — relative paths fail in several
         scrapers (Facebook, Slack, some Discord cases). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elyxion" />
    <meta property="og:url" content="https://instagib.win/" />
    <meta property="og:title" content="Elyxion — one shot, one kill" />
    <meta
      property="og:description"
      content="Quake-style instagib in the browser. The railgun always kills — so the whole game is aim and movement. Strafe, dash, double-jump, wall-jump. Play free, no download."
    />
    <meta property="og:image" content="https://instagib.win/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Elyxion — a browser-based Quake-style instagib FPS" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- TODO: add your X handle so the card is attributed to you and feeds your following:
         <meta name="twitter:site" content="@yourhandle" />
         <meta name="twitter:creator" content="@yourhandle" /> -->
    <meta name="twitter:title" content="Elyxion — one shot, one kill" />
    <meta
      name="twitter:description"
      content="Browser FPS. One railgun, one shot, pure aim + movement. Play free in your browser."
    />
    <meta name="twitter:image" content="https://instagib.win/og-image.png" />

    <!-- Structured data: lets Google show a VideoGame rich result and helps
         AI/search crawlers understand the page even without running JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Elyxion",
        "url": "https://instagib.win/",
        "image": "https://instagib.win/og-image.png",
        "description": "A free, browser-based, server-authoritative Quake-style instagib FPS. One railgun, one shot, one kill — the whole game is aim and movement. Free-for-all, team deathmatch, ranked 1v1 duels, and last-man-standing.",
        "genre": ["First-person shooter", "Arena shooter", "Instagib"],
        "gamePlatform": ["Web browser"],
        "operatingSystem": "Any (web browser)",
        "applicationCategory": "Game",
        "playMode": ["MultiPlayer", "SinglePlayer"],
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist+Mono:wght@400..600&family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlable fallback: the app is a React SPA, so without this a crawler
         that doesn't run JS (most social/AI scrapers) sees an empty page.
         This gives search engines real, indexable text. -->
    <noscript>
      <main style="max-width: 720px; margin: 0 auto; padding: 2rem; font-family: system-ui, sans-serif; color: #eee; background: #0a0a0a;">
        <h1>Elyxion — free browser instagib FPS</h1>
        <p>
          Elyxion is a free, server-authoritative, Quake-style instagib
          first-person shooter you play instantly in your browser — no download,
          no install. Every shot from the railgun is a one-shot kill, so the
          entire game comes down to aim and movement: strafe-jump, dash,
          double-jump, and wall-jump.
        </p>
        <h2>Game modes</h2>
        <ul>
          <li>Free-for-all deathmatch</li>
          <li>Team deathmatch</li>
          <li>Ranked 1v1 duels with an Elo ladder</li>
          <li>Last-man-standing</li>
          <li>Solo practice and offline matches against bots</li>
        </ul>
        <p><a href="/play">Play Elyxion free in your browser</a>.</p>
        <p>This game requires JavaScript to play. Please enable JavaScript.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
